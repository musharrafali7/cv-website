<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 450" width="100%" height="100%">
  <!-- Background Card: Pure White with 1.5px Solid #111111 border -->
  <rect width="360" height="450" rx="8" fill="#FFFFFF" stroke="#111111" stroke-width="1.5" />

  <!-- Clean User Silhouette Icon -->
  <g transform="translate(180, 185)">
    <!-- Head -->
    <circle cx="0" cy="-45" r="44" fill="#ADDDFF" stroke="#111111" stroke-width="2" />
    <!-- Body -->
    <path d="M -70 55 C -65 -5, 65 -5, 70 55 Z" fill="#ADDDFF" stroke="#111111" stroke-width="2" />
  </g>

  <!-- Placeholder Label Pill (10% Accent) -->
  <g transform="translate(180, 310)">
    <rect x="-95" y="-16" width="190" height="32" rx="4" fill="#ADDDFF" stroke="#111111" stroke-width="1.5" />
    <text x="0" y="5" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#111111" text-anchor="middle" letter-spacing="0.5">PHOTO PLACEHOLDER</text>
  </g>

  <text x="180" y="365" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="600" fill="#333333" text-anchor="middle">Add your picture as placeholder.jpg</text>
</svg>
